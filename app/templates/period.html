<form method="get" class="period"><select name="periode" aria-label="Periode">{% for value in ['harian','mingguan','bulanan','tahunan'] %}<option value="{{ value }}" {% if analysis.kind==value %}selected{% endif %}>{{ value|capitalize }}</option>{% endfor %}</select><input type="date" name="tanggal" value="{{ analysis.selected }}" aria-label="Tanggal acuan" required><button>Tampilkan</button>{% if export %}<button class="btn-light" name="export" value="xlsx">Unduh Excel</button>{% endif %}</form>
