{% for n in notification_recent %}<article class="notification-item {{ 'is-unread' if not n.read_at else '' }}" data-notification-id="{{ n.id }}"><span class="notification-dot" aria-hidden="true"></span><div><a href="{{ n.link }}" data-notification-open="{{ n.id }}"><strong>{{ n.title }}</strong></a><p>{{ n.message }}</p><time>{{ n.created_at|wib }}</time></div>{% if not n.read_at %}<button type="button" class="notification-read" data-notification-read="{{ n.id }}" aria-label="Tandai dibaca: {{ n.title }}">✓</button>{% endif %}</article>{% else %}<p class="notification-empty">Belum ada notifikasi.</p>{% endfor %}
