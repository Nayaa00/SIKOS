{% extends 'base.html' %}{% block content %}<span class="eyebrow">MASTER DATA</span><h1>Kategori produk</h1><div class="card"><h2>Tambah kategori</h2><form method="post" action="/kategori/simpan" class="toolbar"><input type="hidden" name="csrf" value="{{ csrf }}"><input name="nama" placeholder="Misalnya Beras" maxlength="100" required><label><input type="checkbox" name="active" checked> Aktif</label><button>Tambah</button></form></div><div class="card"><table><tr><th>Nama kategori</th><th>Status</th><th>Aksi</th></tr>{% for c in categories %}<tr><td><form id="category-{{ c.id }}" method="post" action="/kategori/simpan"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="id" value="{{ c.id }}"><input name="nama" value="{{ c.nama }}" required maxlength="100"></form></td><td><label><input form="category-{{ c.id }}" type="checkbox" name="active" {% if c.active %}checked{% endif %}> Aktif</label></td><td><button form="category-{{ c.id }}" class="btn-sm">Simpan</button> <form class="inline" method="post" action="/kategori/{{ c.id }}/hapus"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="btn-danger btn-sm">Nonaktifkan</button></form></td></tr>{% else %}<tr><td colspan="3" class="empty">Belum ada kategori.</td></tr>{% endfor %}</table></div>{% endblock %}
