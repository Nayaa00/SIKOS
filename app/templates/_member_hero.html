{% macro member_hero(kicker,title,description,show_catalog=false) %}
<section class="member-hero"><div class="member-hero-ring" aria-hidden="true"></div><div class="member-hero-content"><p class="member-hero-kicker">{{ kicker }}</p><h1>{{ title }}</h1><p class="member-hero-description">{{ description }}</p><div class="member-hero-actions">{% if show_catalog %}<a href="/katalog" class="member-hero-button member-hero-primary">Lihat Katalog Produk →</a><a href="/keranjang" class="member-hero-button member-hero-primary">Buka keranjang →</a>{% else %}<a href="/keranjang" class="member-hero-button member-hero-primary">Buka Keranjang →</a>{% endif %}</div></div></section>
{% endmacro %}
