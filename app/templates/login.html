{% extends 'base.html' %}{% block content %}<div class="auth"><div class="auth-heading"><span class="eyebrow">KOPERASI SEJAHTERA</span><h1>Selamat datang kembali.</h1><p class="muted">Masuk untuk mengelola atau memesan kebutuhan harian.</p></div><div class="card">{% if error %}<p class="notice form-error" role="alert">{{ error }}</p>{% endif %}<form method="post" action="/login"><input type="hidden" name="csrf" value="{{ csrf }}"><div class="field"><label for="login-email">Email</label><input id="login-email" value="{{ values.email if values else '' }}" maxlength="190" type="email" name="email" required autocomplete="username"></div><div class="field"><label for="login-password">Password</label><input id="login-password" type="password" name="password" required autocomplete="current-password" maxlength="128"></div><button>Masuk ke SIKOS</button></form><p class="small-note mt-3">Belum punya akun? <a href="/daftar">Daftar anggota</a></p></div></div>{% endblock %}
