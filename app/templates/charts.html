<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<script id="trend-data" type="application/json">{{ analysis.trend|tojson }}</script>
<script>if(window.Chart){const rows=JSON.parse(document.getElementById('trend-data').textContent);new Chart(document.getElementById('trend'),{type:'bar',data:{labels:rows.map(r=>r.hari),datasets:[{label:'Penjualan (Rp)',data:rows.map(r=>r.subtotal),backgroundColor:'#30785d',borderRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});}else{document.getElementById('trend').parentElement.insertAdjacentHTML('beforeend','<p>Grafik memerlukan koneksi internet. Rincian angka tetap tersedia di tabel laporan.</p>');}</script>
